[project]
name = "cultural-events-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "lucas.goleiro1995@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langgraph>=1.2.18",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
cultural-events-agent = "cultural_events_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
